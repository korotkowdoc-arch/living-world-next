name: LIVING WORLD NEXT checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: npm run check
      - name: Unit and contract tests
        run: npm test
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser game menu smoke test
        run: node test/browser/native-menu-smoke.mjs
